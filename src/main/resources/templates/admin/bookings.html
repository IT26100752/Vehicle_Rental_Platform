<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('All Bookings')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<div class="band-photo bg-fleet">
    <div class="band-bar">
        <div>
            <p class="overline overline-light">Admin &middot; operations</p>
            <h1 class="band-title">All Bookings</h1>
            <p class="band-sub">Every reservation across the fleet, newest first - open any row for the full record.</p>
        </div>
    </div>
</div>
<main class="container-vrs pull-up">
    <div class="table-card">
        <div class="table-responsive">
            <table class="table-vrs">
                <thead>
                <tr><th>#</th><th>Customer</th><th>Vehicle</th><th>Pickup</th><th>Return</th><th>Total</th><th>Fine</th><th>Status</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bookings}">
                    <td><b th:text="${b.id}">1</b></td>
                    <td th:text="${userNames.get(b.id)}">user</td>
                    <td th:text="${vehicleNames.get(b.id)}">vehicle</td>
                    <td th:text="${b.pickupDate}">d</td>
                    <td th:text="${b.returnDate}">d</td>
                    <td style="font-weight:800" th:text="'LKR ' + ${#numbers.formatDecimal(b.totalAmount, 1, 'COMMA', 2, 'POINT')}">0</td>
                    <td th:text="${b.fine > 0} ? 'LKR ' + ${#numbers.formatDecimal(b.fine, 1, 'COMMA', 2, 'POINT')} : '—'">0</td>
                    <td><span class="badge" th:classappend="'bg-' + ${b.status.badge()}" th:text="${b.status.label()}">S</span></td>
                    <td><a class="btn btn-line btn-sm-vrs" th:href="@{'/bookings/' + ${b.id}}">Open</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(bookings)}"><td colspan="9" style="padding:44px;text-align:center;color:var(--muted)">No bookings</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
