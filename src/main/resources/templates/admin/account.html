<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('My account')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('admin')}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="admin-shell">
<aside th:replace="~{fragments/layout :: sidebar('account')}"></aside>
<div class="admin-main">

<div class="page-head"><div><h1>My account</h1><p>Your admin profile and password.</p></div></div>
<div class="grid cols-2 mb">
  <section class="card">
    <h2>Profile</h2>
    <div class="summary-line"><span>Name</span><strong th:text="${me.fullName}">Name</strong></div>
    <div class="summary-line"><span>Username</span><strong>@<span th:text="${me.username}">admin1</span></strong></div>
    <div class="summary-line"><span>Role</span><strong th:text="${me.level.label}">Admin</strong></div>
    <div class="summary-line"><span>Email</span><strong th:text="${me.email}">email</strong></div>
  </section>
  <form class="card" method="post" th:action="@{/admin/account/password}" data-loader-text="Saving your password" data-loader-sub="One moment">
    <h2>Change password</h2>
    <div class="field"><label for="cur">Current password</label><input id="cur" name="current" type="password" required autocomplete="current-password"></div>
    <div class="field"><label for="np">New password</label><input id="np" name="password" type="password" required minlength="8" autocomplete="new-password"></div>
    <div class="field"><label for="cf">Confirm new password</label><input id="cf" name="confirm" type="password" required minlength="8" autocomplete="new-password"></div>
    <button class="btn" type="submit">Change password</button>
  </form>
</div>

</div>
</div>
<div th:replace="~{fragments/layout :: loader}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
