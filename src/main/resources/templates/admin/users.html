<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Users')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<div class="band-photo bg-fleet">
    <div class="band-bar">
        <div>
            <p class="overline overline-light">Admin &middot; people</p>
            <h1 class="band-title">Users</h1>
            <p class="band-sub">Roles, contacts and account actions for every member of the platform.</p>
        </div>
        <div class="band-actions">
            <form class="d-flex gap-2" th:action="@{/users}" method="get" style="min-width:300px">
                <input class="form-control" name="keyword" th:value="${keyword}" placeholder="Search name / username / email">
                <button class="btn btn-brand"><i class="bi bi-search"></i></button>
            </form>
        </div>
    </div>
</div>
<main class="container-vrs pull-up">

    <div class="table-card">
        <div class="table-responsive">
            <table class="table-vrs">
                <thead>
                <tr><th>#</th><th>Name</th><th>Username</th><th>Role</th><th>Email</th><th>Phone</th><th style="text-align:right">Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td><b th:text="${u.id}">1</b></td>
                    <td style="font-weight:700" th:text="${u.fullName}">Name</td>
                    <td><code th:text="${u.username}">user</code></td>
                    <!-- POLYMORPHISM in the view: describeRole() picks the subclass text -->
                    <td><span class="pill" th:classappend="${u.canManageUsers()} ? 'pill-brand' : 'pill-info'" th:text="${u.describeRole()}">Role</span></td>
                    <td th:text="${u.email}">e</td>
                    <td th:text="${u.phone}">p</td>
                    <td style="text-align:right;white-space:nowrap">
                        <form class="d-inline" th:if="${u instanceof T(lk.ijse.se1020.vrs.model.CustomerUser)}"
                              th:action="@{'/users/' + ${u.id} + '/toggle-premium'}" method="post">
                            <button class="btn btn-warn-soft btn-sm-vrs"
                                    th:text="${u.premium} ? 'Make regular' : 'Make premium'">premium</button>
                        </form>
                        <form class="d-inline" th:action="@{'/users/' + ${u.id} + '/delete'}" method="post"
                              onsubmit="return confirm('Delete this user?');">
                            <button class="btn btn-danger-soft btn-sm-vrs"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}"><td colspan="7" style="padding:44px;text-align:center;color:var(--muted)">No users found</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="form-text mt-3"><i class="bi bi-shield-lock me-1"></i>Passwords are stored hashed (SHA-256) — they cannot be read back, only verified.</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
