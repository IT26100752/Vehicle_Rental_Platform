<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Customer reviews')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('reviews')}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>

<main>
  <div class="container">
    <div class="page-head"><div><h1>Customer reviews</h1><p>Honest ratings from people who have completed a rental.</p></div></div>
    <div class="grid cols-3" th:if="${!reviewList.isEmpty()}">
      <article class="review" th:each="r : ${reviewList}">
        <div class="row between"><span th:replace="~{fragments/layout :: stars(${r.rating})}"></span><span class="small muted" th:text="${#temporals.format(r.createdAt, 'dd MMM yyyy')}">Date</span></div>
        <blockquote th:text="${r.comment != null} ? ${r.comment} : 'Rated ' + ${r.rating} + ' out of 5.'">Comment</blockquote>
        <div class="admin-reply small" th:if="${r.adminReply != null}"><strong>Reply from DriveLanka:</strong> <span th:text="${r.adminReply}">Thank you</span></div>
        <div class="small"><strong th:text="${r.customerName}">Name</strong> <span class="muted">on the</span> <span th:text="${r.vehicleModel}">Toyota Aqua</span></div>
      </article>
    </div>
    <div class="empty" th:if="${reviewList.isEmpty()}"><h3>No reviews yet</h3><p>Be the first: complete a rental and tell others how it went.</p><a class="btn" th:href="@{/vehicles}">Browse vehicles</a></div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: loader}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
