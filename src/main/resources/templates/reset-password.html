<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Reset password')}"></head>
<body class="auth-page">
<header th:replace="~{fragments/layout :: navbar('login')}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>

<div class="auth2">
  <div class="auth2-card">
    <aside class="auth2-show alt">
      <a class="auth2-brand" th:href="@{/}"><img th:src="@{/images/logo.svg}" alt="" width="34" height="34"><span>DriveLanka Rentals</span></a>
      <div>
        <h2>Choose a new password.</h2>
        <p>Pick something at least 8 characters long that you do not use anywhere else.</p>
      </div>
      <img class="auth2-car" th:src="@{/images/car-blue.svg}" alt="" aria-hidden="true">
    </aside>
    <div class="auth2-form">
    <div class="auth2-inner">
      <th:block th:if="${validToken}">
        <h1 style="font-size:1.8rem">New password</h1>
        <div class="alert error" th:if="${resetError}" th:text="${resetError}">Error</div>
        <form th:action="@{/reset-password}" method="post" data-loader-text="Saving your password" data-loader-sub="One moment">
          <input type="hidden" name="token" th:value="${token}">
          <div class="field"><label for="rp-pass">New password</label>
            <div class="inp"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 018 0v3"/></svg><input id="rp-pass" name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></div></div>
          <div class="field"><label for="rp-conf">Confirm new password</label>
            <div class="inp"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 018 0v3"/></svg><input id="rp-conf" name="confirm" type="password" required minlength="8" autocomplete="new-password" placeholder="Repeat the password"></div></div>
          <button class="btn block big" type="submit">Change password</button>
        </form>
      </th:block>
      <th:block th:unless="${validToken}">
        <h1 style="font-size:1.8rem">Link not valid</h1>
        <p class="muted">This reset link is invalid, already used or expired.</p>
        <a class="btn" th:href="@{/forgot-password}">Ask for a new link</a>
      </th:block>
    </div>
    </div>
  </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: loader}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
