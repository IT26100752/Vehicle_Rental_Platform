<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Your trip')}"></head>
<body>
<header class="nav">
  <div class="container nav-inner">
    <a class="brand" th:href="@{/}"><img class="brand-mark" th:src="@{/images/logo.svg}" alt="" width="34" height="34"><span>DriveLanka Rentals</span></a>
    <button class="theme-btn" style="margin-left:auto" id="themeToggle" type="button" aria-label="Switch between dark and light mode" title="Dark / light mode">
            <svg class="ico i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="ico i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 019.8 3.5a8.5 8.5 0 1010.7 10.7z"/></svg>
        </button>
  </div>
</header>
<div th:replace="~{fragments/layout :: flash}"></div>
<main><div class="container" style="max-width:480px">
  <div class="card stack reveal">
    <h1 style="font-size:1.8rem">Trip <span th:text="${booking.reference}">BK-1</span></h1>
    <p class="muted">Hello <strong th:text="${driver.fullName}">Driver</strong>, here are the details of your trip.</p>
    <div class="summary-line"><span>Vehicle</span><strong th:text="${booking.vehicleModel} + ' (' + ${booking.vehicleRegNo} + ')'">Car</strong></div>
    <div class="summary-line"><span>From</span><strong th:text="${#temporals.format(booking.pickupDate, 'dd MMM yyyy')} + ' at ' + ${booking.pickupTime}">10 Oct</strong></div>
    <div class="summary-line"><span>Until</span><strong th:text="${#temporals.format(booking.returnDate, 'dd MMM yyyy')}">13 Oct</strong></div>
    <div class="summary-line"><span>Pick up at</span><strong th:text="${booking.pickupLocationName}">Colombo</strong></div>
    <div class="summary-line" th:if="${booking.pickupAddress != null and !booking.pickupAddress.isEmpty()}"><span>Street address</span><strong th:text="${booking.pickupAddress}">Street</strong></div>
    <div class="summary-line"><span>Drop-off</span><strong th:text="${booking.dropLocationName}">Kandy</strong></div>
    <div class="summary-line"><span>Customer</span><strong th:text="${booking.renterName}">Name</strong></div>
    <div th:if="${assignment.status.name() == 'CANCELLED'}" class="alert error"><div>This trip was cancelled or given to another driver.</div></div>
    <div th:if="${assignment.status.name() == 'ACKNOWLEDGED'}" class="alert success"><div>You confirmed this trip on <span th:text="${#temporals.format(assignment.acknowledgedAt, 'dd MMM yyyy HH:mm')}">date</span>.</div></div>
    <form th:if="${assignment.status.name() == 'ASSIGNED'}" method="post" th:action="@{/driver/trip/{t}/acknowledge(t=${assignment.token})}">
      <button class="btn big block" type="submit">I have seen this trip</button>
    </form>
  </div>
</div></main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: loader}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
