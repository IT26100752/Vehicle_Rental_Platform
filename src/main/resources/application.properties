# ------------------------------------------------------------------
# Vehicle Rental Service Management System
# ------------------------------------------------------------------
spring.application.name=Vehicle Rental Service Management System
server.port=8080

# Sessions are tracked with the cookie ONLY (no ";jsessionid=" in URLs).
server.servlet.session.tracking-modes=cookie

# Thymeleaf (view layer). Cache off so edits show without restart.
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------------------
# STORAGE SWITCH
#   mysql -> records live in MySQL tables (schema 'vrs')
#   file  -> records live in JSON files under app.data-dir
# ------------------------------------------------------------------
app.storage=mysql
app.data-dir=data

# ------------------------------------------------------------------
# MySQL connection  (user: root / password: 1234)
#  createDatabaseIfNotExist : creates schema 'vrs' on first run
#  allowPublicKeyRetrieval  : fixes "Public Key Retrieval is not allowed"
#  useSSL=false             : avoids SSL errors on a local MySQL
#  serverTimezone           : fixes timezone errors on MySQL 8
# ------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/vrs?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Create the tables automatically on every start from database/database.sql
# (CREATE TABLE IF NOT EXISTS - existing data is never touched).
# Run the app from the PROJECT ROOT folder (IntelliJ / mvn spring-boot:run do this).
# This fixes: "Table 'vrs.users' doesn't exist".
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:./database/database.sql
spring.sql.init.encoding=UTF-8

logging.level.com.vehiclerental=INFO
