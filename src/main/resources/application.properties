spring.application.name=Vehicle Rental Management System
server.port=8080

# ---- File handling (the storage layer): every record type is a text file in this folder
app.data-dir=data

# ---- Public address of the site (used for the buttons inside emails)
app.base-url=http://localhost:8080

# ---- Business rules
app.late-fee.percent-per-day=10
app.booking.hold-minutes=15
# true  = admin may hand over / record a return on any date (useful while testing).
# false = handover only from the pickup date, no future return dates.
app.allow-early-handover=true

# ---- Driver option and locations
# Extra charge per day when the customer books "with driver"
app.driver.fee-per-day=3500
# Extra charge when the vehicle is returned at a different location than where it was picked up (one-way fee)
app.booking.one-way-fee=2500

# ---- Payment: bank transfer details shown to the customer
app.bank.name=Commercial Bank of Ceylon
app.bank.account-name=DriveLanka Rentals (Pvt) Ltd
app.bank.account-number=1000 2345 6789
app.bank.branch=Colombo 07

# ---- Web
spring.thymeleaf.cache=false
spring.mvc.throw-exception-if-no-handler-found=true
server.servlet.session.timeout=30m
server.error.whitelabel.enabled=false
spring.web.resources.cache.cachecontrol.max-age=0

# ---- Show the real cause on the error page while developing (turn off for real use)
server.error.include-message=always
server.error.include-exception=true

# ---- Email
# false = save every email as files in data/outbox (the verification code is also printed in the console)
# true  = send real mail through SMTP, see docs/EMAIL-GUIDE.md
app.mail.enabled=true
app.mail.from=${MAIL_USERNAME:}
app.mail.from-name=DriveLanka Rentals
# Real SMTP mail is sent on a background thread so a slow mail server never blocks a booking
app.mail.async=true
# Verification code settings
app.verify.code-minutes=15
app.verify.max-attempts=5
app.verify.resend-seconds=60

# Admin alert emails (new booking, bank transfer to verify, complaint, bad review ...)
app.notify.admin-email=true
# Leave empty to alert every administrator's own email address, or put one shared address here
app.notify.admin-address=

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---- Company details printed on receipts and emails
app.company.name=DriveLanka Rentals (Pvt) Ltd
app.company.address=42 Galle Road, Colombo 03, Sri Lanka
app.company.phone=+94 11 234 5678
app.company.email=hello@drivelanka.example

spring.datasource.url=jdbc:mysql://localhost:3306/vehicle_rental?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# Disable file-based sample data seeder when using MySQL
app.seeder.enabled=false